<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>NetCatChanger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icons: Lucide (ISC), copied verbatim from lucide-static 1.52.0, see
     assets/lucide/ and LICENSE-lucide.txt. Drawn once, used by reference. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></symbol>
    <symbol id="i-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-shield-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 2 20 20"/><path d="M5 5a1 1 0 0 0-1 1v7c0 5 3.5 7.5 7.67 8.94a1 1 0 0 0 .67.01c2.35-.82 4.48-1.97 5.9-3.71"/><path d="M9.309 3.652A12.252 12.252 0 0 0 11.24 2.28a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1v7a9.784 9.784 0 0 1-.08 1.264"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/></symbol>
    <symbol id="i-file-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  </defs>
</svg>

<div id="app">

  <div id="titlebar">
    <div class="t-logo">
      <!-- NetCatChanger's own mark (Noar's artwork, assets/NetCatChanger.svg),
           strokes drawn in the text colour so it reads on the dark page. -->
      <svg class="t-mark" viewBox="0 0 800 800" aria-hidden="true">
        <rect x="78.69" y="60" width="642.63" height="284" rx="142" fill="none" stroke="currentColor" stroke-width="67"/>
        <circle cx="570.33" cy="202" r="70.99" fill="#5936d8"/>
        <rect x="78.69" y="456" width="642.63" height="284" rx="142" fill="none" stroke="currentColor" stroke-width="67"/>
        <circle cx="229.67" cy="598" r="70.99" fill="#ff0062"/>
      </svg>
      <span>net<span class="cat">cat</span>changer</span>
    </div>
    <div class="t-spacer"></div>
    <div class="t-actions">
      <button class="ibtn" id="btn-refresh" aria-label="Refresh" title="Read the network again">
        <svg><use href="#i-refresh"/></svg></button>
      <button class="ibtn" id="btn-flush" aria-label="Flush DNS" title="Flush the DNS cache">
        <svg><use href="#i-eraser"/></svg></button>
      <button class="ibtn" id="btn-log" aria-label="Session log" title="Open the log of every change">
        <svg><use href="#i-file-text"/></svg></button>
      <button class="ibtn" id="btn-settings" aria-label="Settings" title="Settings and About">
        <svg><use href="#i-settings"/></svg></button>
      <div id="wincontrols">
        <button id="win-min" aria-label="Minimize" title="Minimize"><svg><use href="#i-minus"/></svg></button>
        <button id="win-max" aria-label="Maximize" title="Maximize"><svg><use href="#i-square"/></svg></button>
        <button id="win-close" class="close" aria-label="Close" title="Close NetCatChanger"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
  </div>

  <div id="main">
    <div class="lbl sec-title">Network adapters <span class="count" id="ad-count"></span></div>
    <div id="adapters">
      <div class="card empty">Reading the network…</div>
    </div>

    <!-- VPN: shown only while a WireGuard tunnel runs, or while NetCatChanger
         is sending the VPN through another connection. -->
    <div id="vpn-section" hidden>
      <div class="lbl sec-title">VPN</div>
      <div class="card vpn" id="vpn-card">
        <div class="tile" id="vpn-tile"><svg><use href="#i-route"/></svg></div>
        <div class="what">
          <div class="obj-name" id="vpn-name">VPN</div>
          <div class="state" id="vpn-state"></div>
          <div class="state sub" id="vpn-hint"></div>
        </div>
        <div class="ctl" id="vpn-actions"></div>
      </div>
    </div>

    <div class="lbl sec-title">Windows firewall</div>
    <div class="card fw" id="fw-card">
      <div class="tile" id="fw-tile"><svg><use href="#i-shield-check"/></svg></div>
      <div class="what">
        <div class="obj-name">Windows Firewall</div>
        <div class="state" id="fw-state">Reading…</div>
      </div>
      <div class="ctl">
        <span class="badge" id="fw-badge">…</span>
        <button class="switch" id="fw-switch" role="switch" aria-checked="false"
                aria-label="Windows Firewall" title="Turn Windows Firewall on or off"></button>
      </div>
    </div>
  </div>

  <div id="footer">
    <span id="ver">v…</span>&nbsp;·&nbsp;<a id="gh">github</a>
    <span class="sp"></span>
    <span id="status" class="busy">Loading…</span>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
